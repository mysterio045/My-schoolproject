# Alembic Configuration File
# ==========================
# This file configures Alembic for database migrations.
# The actual migration logic is in alembic/env.py

[alembic]
# Path to migration scripts
script_location = alembic

# SQLAlchemy URL — overridden in env.py from app.config
# This is a fallback placeholder
sqlalchemy.url = postgresql+asyncpg://postgres:placeholder@localhost:5432/postgres

# Template used for new migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
